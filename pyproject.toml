[tool.poetry]
name = "function-predictor"
version = "0.1.0"
description = "NEAT experiment for extrapolating sequences generated by unknown functions."
readme = "README.md"
package-mode = false
[tool.poetry.dependencies]
python = "^3.13"
neat-python = "^2.0.0"
numpy = "^2.4.6"
matplotlib = "^3.10.9"
notebook = "^7.5.6"
ipykernel = "^7.2.0"
pyright = "^1.1.409"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.13,<0.16.0)"
]
